# =============================================================================
# rm_hw_bridge 默认参数
# =============================================================================

rm_hw_bridge:
  ros__parameters:
    # ---- 串口配置 ----
    serial_device: "/dev/ttyUSB0"    # 串口设备路径
    baudrate: 921600                  # Hohokam 8caff9c V2，8N1

    # ---- 坐标系 ----
    frame_id: "gimbal_imu_link"
    chassis_frame_id: "chassis_imu_link"
    publish_joint_states: false       # IMU 参考系姿态不是底盘相对关节角；默认不发布兼容 JointState

    # ---- CRC 校验 ----
    require_crc_check: true           # 两端严格CRC，不允许绕过

    # 默认真只收：O_RDONLY，不创建发送定时器，退出也不发停止帧。
    read_only: true
    # 关闭只收后也需分别启用执行许可。导航在下位机中已放行，禁止默认开启。
    tx_rate_hz: 50
    allow_control: false
    allow_nav: false
    allow_friction: false
    allow_shoot: false
    valid_for_ms: 100                # 下位机允许 1..150ms
    command_timeout_ms: 100
    nav_timeout_ms: 100
    feedback_timeout_ms: 100
    # ROS绝对目标角减去当前IMU角；实机核对机构纠偏正方向
    yaw_error_sign: 1.0
    pitch_error_sign: 1.0
    correction_scale: 1.0
    max_error_deg: 5.0               # 配置用度，线上 yaw/pitch_error 使用弧度
